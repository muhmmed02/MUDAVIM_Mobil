        const ProfileCards = ({onBack, currentUser, lang, t}) => {
            const [cards, setCards] = useState(() => {
                const saved = localStorage.getItem(`mudavim_cards_${currentUser?.id || 'default'}`);
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 1,
                        bankName: "Garanti BBVA Bonus",
                        network: "Visa",
                        number: "**** **** **** 1234",
                        holder: currentUser?.name?.toUpperCase() || "A. KAYGISIZ",
                        expiry: "12/28",
                        color: "#008A5E"
                    }
                ];
            });

            const [showAddCard, setShowAddCard] = useState(false);
            const [cardNumber, setCardNumber] = useState('');
            const [expiryDate, setExpiryDate] = useState('');
            const [cardHolder, setCardHolder] = useState('');
            const [cvv, setCvv] = useState('');

            useEffect(() => {
                localStorage.setItem(`mudavim_cards_${currentUser?.id || 'default'}`, JSON.stringify(cards));
            }, [cards, currentUser]);

            const validateLuhn = (num) => {
                let s = num.replace(/\s+/g, '');
                let sum = 0;
                let shouldDouble = false;
                for (let i = s.length - 1; i >= 0; i--) {
                    let digit = parseInt(s.charAt(i));
                    if (shouldDouble) {
                        digit *= 2;
                        if (digit > 9) digit -= 9;
                    }
                    sum += digit;
                    shouldDouble = !shouldDouble;
                }
                return (sum % 10) === 0;
            };

            const detectCardNetwork = (num) => {
                let s = num.replace(/\s+/g, '');
                if (s.startsWith('4')) return 'Visa';
                if (/^(5[1-5]|2[2-7])/.test(s)) return 'Mastercard';
                if (/^(34|37)/.test(s)) return 'American Express';
                if (/^(9792|65)/.test(s)) return 'Troy';
                return 'Troy';
            };

            const detectBank = (num) => {
                let s = num.replace(/\s+/g, '');
                if (s.startsWith('5406') || s.startsWith('4043') || s.startsWith('5526')) return { name: "Garanti BBVA", color: "#008A5E" };
                if (s.startsWith('4508') || s.startsWith('4355') || s.startsWith('5571')) return { name: "Akbank", color: "#E31B23" };
                if (s.startsWith('4543') || s.startsWith('5437')) return { name: "İş Bankası", color: "#0A4D9A" };
                if (s.startsWith('4410') || s.startsWith('5421')) return { name: "Yapı Kredi", color: "#EAB308" };
                if (s.startsWith('4600') || s.startsWith('5430')) return { name: "Ziraat Bankası", color: "#C8102E" };
                if (s.startsWith('5400') || s.startsWith('4610')) return { name: "Halkbank", color: "#004F9F" };
                return { name: "Diğer Banka", color: "#1E293B" };
            };

            const handleAddCardSubmit = (e) => {
                e.preventDefault();
                let cleanNumber = cardNumber.replace(/\s+/g, '');
                if (cleanNumber.length < 16) {
                    alert(lang === 'tr' ? "Lütfen geçerli bir 16 haneli kart numarası girin." : "Please enter a valid 16-digit card number.");
                    return;
                }
                if (!validateLuhn(cleanNumber)) {
                    alert(lang === 'tr' ? "Girdiğiniz kart numarası geçersizdir (Luhn algoritması kontrolünden geçemedi)." : "The card number you entered is invalid (failed Luhn algorithm check).");
                    return;
                }
                if (!expiryDate || !expiryDate.includes('/') || expiryDate.length < 5) {
                    alert(lang === 'tr' ? "Lütfen geçerli bir son kullanma tarihi girin (AA/YY)." : "Please enter a valid expiration date (MM/YY).");
                    return;
                }
                if (!cardHolder.trim()) {
                    alert(lang === 'tr' ? "Lütfen kart sahibinin adını girin." : "Please enter the cardholder's name.");
                    return;
                }

                const bankInfo = detectBank(cleanNumber);
                const network = detectCardNetwork(cleanNumber);

                const newCard = {
                    id: Date.now(),
                    bankName: bankInfo.name,
                    network: network,
                    number: `**** **** **** ${cleanNumber.slice(-4)}`,
                    holder: cardHolder.toUpperCase().trim(),
                    expiry: expiryDate,
                    color: bankInfo.color
                };

                setCards(prev => [...prev, newCard]);
                setShowAddCard(false);
                setCardNumber('');
                setExpiryDate('');
                setCardHolder('');
                setCvv('');
                alert(lang === 'tr' ? "Kartınız başarıyla kaydedildi!" : "Your card has been saved successfully!");
            };

            const handleCardNumberInput = (val) => {
                let v = val.replace(/\D/g, '').slice(0, 16);
                let formatted = v.replace(/(\d{4})/g, '$1 ').trim();
                setCardNumber(formatted);
            };

            const handleExpiryInput = (val) => {
                let v = val.replace(/\D/g, '').slice(0, 4);
                if (v.length >= 2) {
                    v = v.slice(0, 2) + '/' + v.slice(2);
                }
                setExpiryDate(v);
            };

            return (
                <div style={{position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', background: '#F0F2F5', zIndex: 1000, overflowY: 'auto', display: 'flex', flexDirection: 'column'}}>

                        <h2 style={{margin: '0 auto', fontSize: '18px', fontWeight: '500'}}>{t('savedCards')}</h2>
                    </div>
                    
                    <div style={{padding: '20px', display: 'flex', flexDirection: 'column', gap: '15px'}}>
                        {cards.map(c => (
                            <div key={c.id} style={{
                                background: `linear-gradient(135deg, ${c.color}, #0f172a)`, 
                                borderRadius: '16px', padding: '25px', color: 'white', position: 'relative', 
                                overflow: 'hidden', boxShadow: '0 4px 15px rgba(0,0,0,0.1)'
                            }}>
                                <div style={{position: 'absolute', right: '-20px', top: '-20px', fontSize: '150px', opacity: 0.1}}>
                                    <i className={c.network === 'Visa' ? 'fa-brands fa-cc-visa' : (c.network === 'Mastercard' ? 'fa-brands fa-cc-mastercard' : (c.network === 'American Express' ? 'fa-brands fa-cc-amex' : 'fa-solid fa-credit-card'))}></i>
                                </div>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px', position: 'relative', zIndex: 2}}>

        // --- MAIN APP COMPONENT ---
        const App = () => {
            // Check LocalStorage for Login State
            const [isLoggedIn, setIsLoggedIn] = useState(() => {
                const saved = localStorage.getItem('mudavim_isLoggedIn');
                return saved ? JSON.parse(saved) : false;
            });
            const [currentTab, setCurrentTab] = useState('home');
            const [selectedMerchant, setSelectedMerchant] = useState(null);

            // API trigger/force state update
            const [apiLoaded, setApiLoaded] = useState(false);

            // Current logged-in customer info
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('mudavim_user');
                return saved ? JSON.parse(saved) : null;
            });

            // --- LIFTED STATES WITH LOCALSTORAGE PERSISTENCE ---
            const [favorites, setFavorites] = useState(() => {
                const saved = localStorage.getItem('mudavim_favorites');
                return saved ? JSON.parse(saved) : [];
            }); 
            
            const [coupons, setCoupons] = useState(() => {
                const saved = localStorage.getItem('mudavim_coupons');
                return saved ? JSON.parse(saved) : initialCoupons;
            });

            // Language State (Turkish by default)
            const [lang, setLang] = useState(() => {
                const saved = localStorage.getItem('mudavim_lang');
                return saved || 'tr';
            });
            useEffect(() => {
                localStorage.setItem('mudavim_lang', lang);
            }, [lang]);

            // Translation helper function
            const t = (key, variables = {}) => {
                const dict = translations[lang] || translations['tr'];
                let text = dict[key] || translations['tr'][key] || key;
                Object.keys(variables).forEach(v => {
                    text = text.replace(`{${v}}`, variables[v]);
                });
                return text;
            };

            // Cart State
            const [cart, setCart] = useState(() => {
                const saved = localStorage.getItem('mudavim_cart');
                return saved ? JSON.parse(saved) : [];
            });
            useEffect(() => {
                localStorage.setItem('mudavim_cart', JSON.stringify(cart));
            }, [cart]);

            const [showCartModal, setShowCartModal] = useState(false);
            const [activeOrders, setActiveOrders] = useState([]);
            const [qrDataOverride, setQrDataOverride] = useState(null);

            const fetchActiveOrders = () => {
                if (!currentUser) return;
                fetch(`${API_BASE_URL}/api/active-orders/?kullanici_id=${currentUser.id}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            const newActive = data.active_orders || [];
                            setActiveOrders(prev => {
                                if (prev.length > 0 && newActive.length < prev.length) {
                                    // An active order was completed or cancelled, refresh history
                                    fetchOrders();
                                    fetchMerchants();
                                }
                                return newActive;
                            });
                        }
                    })
                    .catch(err => console.error("Error fetching active orders:", err));
            };


            const handleAddToCart = (item, merchantId) => {
                setCart(prev => {
                    const existing = prev.find(i => i.id === item.id);
                    if (existing) {
                        return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, { ...item, qty: 1, merchantId: merchantId }];
                });
            };
            
            const [orders, setOrders] = useState(() => {
                const userSaved = localStorage.getItem('mudavim_user');
                const user = userSaved ? JSON.parse(userSaved) : null;
                if (user) {
                    const saved = localStorage.getItem(`mudavim_orders_${user.id}`);
                    if (saved) return JSON.parse(saved);
                    if (user.username === 'test') {
                        return [{
                            id: "6a06021b97625239e9b2b523",
                            merchantId: 1,
                            date: "14.05.2026, 20:11",
                            desc: "Mocha Frappe",
                            reviewed: false,
                            price: 85
                        }];
                    }
                }
                return [];
            });
            
            const [reviews, setReviews] = useState(() => {
                const saved = localStorage.getItem('mudavim_reviews');
                return saved ? JSON.parse(saved) : [];
            });

            // Save to LocalStorage whenever state changes
            useEffect(() => { localStorage.setItem('mudavim_isLoggedIn', JSON.stringify(isLoggedIn)); }, [isLoggedIn]);
            useEffect(() => { localStorage.setItem('mudavim_favorites', JSON.stringify(favorites)); }, [favorites]);
            useEffect(() => { localStorage.setItem('mudavim_coupons', JSON.stringify(coupons)); }, [coupons]);
            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem(`mudavim_orders_${currentUser.id}`, JSON.stringify(orders));
                }
            }, [orders, currentUser]);
            useEffect(() => { localStorage.setItem('mudavim_reviews', JSON.stringify(reviews)); }, [reviews]);

            // Fetch merchants & coupons
            const fetchMerchants = () => {
                const url = currentUser 
                    ? `${API_BASE_URL}/api/merchants/?kullanici_id=${currentUser.id}`
                    : `${API_BASE_URL}/api/merchants/`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            merchants = data.merchants; // Update global variable
                            setApiLoaded(prev => !prev); // Trigger rerender
                        }
                    })
                    .catch(err => console.error("Error fetching merchants:", err));
            };

            const fetchCoupons = () => {
                const url = currentUser
                    ? `${API_BASE_URL}/api/coupons/?kullanici_id=${currentUser.id}`
                    : `${API_BASE_URL}/api/coupons/`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            setCoupons(data.coupons);
                        }
                    })
                    .catch(err => console.error("Error fetching coupons:", err));
            };

            const fetchOrders = () => {
                if (!currentUser) return;
                fetch(`${API_BASE_URL}/api/previous-orders/?kullanici_id=${currentUser.id}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success' && data.orders.length > 0) {
                            setOrders(data.orders);
                        }
                    })
                    .catch(err => console.error("Error fetching orders:", err));
            };

            useEffect(() => {
                fetchMerchants();
                fetchCoupons();
                if (currentUser) {
                    fetchOrders();
                    fetchActiveOrders();
                    const interval = setInterval(() => fetchActiveOrders(), 10000);
                    return () => clearInterval(interval);
                }
            }, [currentUser]);

            // Handle routing resets
            useEffect(() => {
                if (selectedMerchant === null) {
                    window.scrollTo(0, 0);
                }
            }, [currentTab, selectedMerchant]);

            // --- STATE HANDLERS ---
            const toggleFavorite = (merchantId) => {
                setFavorites(prev => 
                    prev.includes(merchantId) 
                        ? prev.filter(id => id !== merchantId)
                        : [...prev, merchantId]
                );
            };

            const addOrder = (merchantId, desc) => {
                if (!currentUser) return;
                fetch(`${API_BASE_URL}/api/stamp/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kullanici_id: currentUser.id,
                        isletme_id: merchantId
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        fetchMerchants();
                        const newOrder = {
                            id: Date.now(),
                            merchantId: merchantId,
                            date: new Date().toLocaleDateString('tr-TR') + ", " + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}),
                            desc: desc,
                            reviewed: false
                        };
                        setOrders(prev => [...prev, newOrder]);
                        alert(lang === 'tr' ? "Damga başarıyla kazanıldı!" : "Stamp earned successfully!");
                    } else {
                        alert((lang === 'tr' ? "Damga kazanılamadı: " : "Failed to earn stamp: ") + data.message);
                    }
                })
                .catch(err => {
                    console.error("Error earning stamp:", err);
                    alert(lang === 'tr' ? "Sunucu bağlantı hatası." : "Server connection error.");
                });
            };

            const addReview = (orderId, merchantId, rating, text) => {
                if (!currentUser) return;
                fetch(`${API_BASE_URL}/api/comment/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kullanici_id: currentUser.id,
                        isletme_id: merchantId,
                        puan: rating,
                        yorum_metni: text
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        const newReview = {
                            id: Date.now(),
                            merchantId: merchantId,
                            rating: rating,
                            text: text,
                            date: new Date().toLocaleDateString('tr-TR')
                        };
                        setReviews(prev => [...prev, newReview]);
                        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, reviewed: true } : o));
                        alert(lang === 'tr' ? "Değerlendirmeniz kaydedildi!" : "Your review has been saved!");
                    } else {
                        alert((lang === 'tr' ? "Değerlendirme gönderilemedi: " : "Failed to submit review: ") + data.message);
                    }
                })
                .catch(err => {
                    console.error("Error submitting review:", err);
                    alert(lang === 'tr' ? "Sunucu bağlantı hatası." : "Server connection error.");
                });
            };

            const handleUseCoupon = (couponId) => {
                if (!currentUser) return;
                fetch(`${API_BASE_URL}/api/use-coupon/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kullanici_id: currentUser.id,
                        kupon_id: couponId
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert(lang === 'tr' ? "Kuponunuz kasada başarıyla kullanıldı!" : "Your coupon was successfully redeemed at checkout!");
                        fetchMerchants();
                        fetchCoupons();
                    } else {
                        alert((lang === 'tr' ? "Kupon kullanılamadı: " : "Failed to redeem coupon: ") + data.message);
                    }
                })
                .catch(err => {
                    console.error("Error using coupon:", err);
                    alert(lang === 'tr' ? "Sunucu bağlantı hatası." : "Server connection error.");
                });
            };

            const handleCheckout = () => {
                if (!currentUser || cart.length === 0) return;
                const merchantId = cart[0]?.merchantId || (selectedMerchant ? selectedMerchant.id : null);
                if (!merchantId) {
                    alert(lang === 'tr' ? 'Sipariş işlemi için bir işletme seçilmemiş.' : 'No merchant selected for checkout.');
                    return;
                }

                // Sipariş türü seçimi ve ödeme simülasyonu
                const isGelAl = window.confirm(
                    lang === 'tr' ? "Siparişi Uygulama Üzerinden mi Ödemek İstersiniz (Gel-Al)? \n[İptal] derseniz Kasada Ödeyeceksiniz." 
                    : "Do you want to pay via App (Take-away)? \nClick [Cancel] to pay at the counter."
                );

                const siparisTuru = isGelAl ? 'gel_al' : 'yerinde';

                if (isGelAl) {
                    // Google Pay entegrasyonu (placeholder) - Kullanıcı isteği doğrultusunda şu an pasif
                    /*
                    // Google Pay API yükleme ve ödeme isteği başlatma adımları
                    const paymentDataRequest = {
                        apiVersion: 2,
                        apiVersionMinor: 0,
                        allowedPaymentMethods: [{
                            type: 'CARD',
                            parameters: {
                                allowedAuthMethods: ['PAN_ONLY', 'CRYPTOGRAM_3DS'],
                                allowedCardNetworks: ['AMEX', 'DISCOVER', 'MASTERCARD', 'VISA']
                            },
                            tokenizationSpecification: {
                                type: 'PAYMENT_GATEWAY',
                                parameters: {
                                    gateway: 'example',
                                    gatewayMerchantId: 'exampleGatewayMerchantId'
                                }
                            }
                        }],
                        transactionInfo: {
                            totalPriceStatus: 'FINAL',
                            totalPrice: total.toString(),
                            currencyCode: 'TRY',
                            countryCode: 'TR'
                        },
                        merchantInfo: {
                            merchantName: selectedMerchant ? selectedMerchant.name : 'Mudavim Uyesi'
                        }
                    };
                    // const paymentsClient = new google.payments.api.PaymentsClient({environment: 'TEST'});
                    // paymentsClient.loadPaymentData(paymentDataRequest).then(...);
                    */
                    
                    const fakeCard = window.prompt(lang === 'tr' ? "Google Pay Simülasyonu: Lütfen Kart Numaranızı Girin (Demo)" : "Google Pay Simulation: Please enter Card Number (Demo)", "1234 5678 9101 1121");
                    if (!fakeCard) {
                        alert(lang === 'tr' ? "Ödeme iptal edildi." : "Payment cancelled.");
                        return;
                    }
                }

                const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
                fetch(`${API_BASE_URL}/api/checkout/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kullanici_id: currentUser.id,
                        isletme_id: merchantId,
                        items: cart.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.price })),
                        total: total,
                        siparis_turu: siparisTuru
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        setCart([]);
                        setShowCartModal(false);
                        fetchMerchants();
                        fetchOrders();
                        fetchActiveOrders(); // Update active orders
                        if (siparisTuru === 'yerinde') {
                            setCurrentTab('qr'); // Show QR for in-store order approval
                            alert(lang === 'tr' ? `Siparişiniz alındı! Yerinde siparişi onaylamak için QR kodunuzu (MUDAVIM-SIPARIS-${data.siparis_id}) kasada gösterin.` : 'Your order placed! Show your QR at checkout.');
                            setQrDataOverride(`MUDAVIM-SIPARIS-${data.siparis_id}`);
                        } else {
                            setCurrentTab('home');
                            alert(lang === 'tr' ? 'Siparişiniz alındı ve ödemeniz tamamlandı! Ana ekrandan durumunu takip edebilirsiniz.' : 'Order placed and paid! Track it from Home screen.');
                        }
                    } else {
                        alert((lang === 'tr' ? 'Sipariş tamamlanamadı: ' : 'Order could not be completed: ') + data.message);
                    }
                })
                .catch(err => {
                    console.error('Checkout error:', err);
                    alert(lang === 'tr' ? 'Sunucu bağlantı hatası.' : 'Server connection error.');
                });
            };

            const handleLogin = (email, name, phone, username, password) => {
                fetch(`${API_BASE_URL}/api/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name, phone, username, password })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        setCurrentUser(data.user);
                        localStorage.setItem('mudavim_user', JSON.stringify(data.user));
                        
                        // Load user specific orders
                        const savedOrders = localStorage.getItem(`mudavim_orders_${data.user.id}`);
                        if (savedOrders) {
                            setOrders(JSON.parse(savedOrders));
                        } else if (data.user.username === 'test') {
                            setOrders([{
                                id: "6a06021b97625239e9b2b523",
                                merchantId: 1,
                                date: "14.05.2026, 20:11",
                                desc: "Mocha Frappe",
                                reviewed: false,
                                price: 85
                            }]);
                        } else {
                            setOrders([]);
                        }
                        
                        // Load user specific cart
                        const savedCart = localStorage.getItem('mudavim_cart');
                        if (savedCart) setCart(JSON.parse(savedCart));

                        setIsLoggedIn(true);
                    } else {
                        alert((lang === 'tr' ? "Giriş başarısız: " : "Login failed: ") + data.message);
                    }
                })
                .catch(err => {
                    console.error("Error during login:", err);
                    alert(lang === 'tr' ? "Giriş yapılamadı, sunucu hatası." : "Failed to login, server error.");
                });
            };

            const handleUpdateProfile = (updatedData) => {
                if (!currentUser) return;
                fetch(`${API_BASE_URL}/api/update-profile/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kullanici_id: currentUser.id,
                        name: updatedData.name,
                        email: updatedData.email,
                        username: updatedData.username,
                        phone: updatedData.phone
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        setCurrentUser(data.user);
                        localStorage.setItem('mudavim_user', JSON.stringify(data.user));
                        alert(lang === 'tr' ? "Bilgileriniz başarıyla güncellendi!" : "Your information has been successfully updated!");
                    } else {
                        alert((lang === 'tr' ? "Güncelleme başarısız: " : "Failed to update profile: ") + data.message);
                    }
                })
                .catch(err => {
                    console.error("Error updating profile:", err);
                    alert(lang === 'tr' ? "Profil güncellenemedi, sunucu hatası." : "Failed to update profile, server error.");
                });
            };

            const handleMerchantClick = (merchant) => {
                setSelectedMerchant(merchant);
            };

            if (!isLoggedIn) {
                return (
                    <LoginScreen 
                        onLogin={(email, name, phone, username, password) => {
                            handleLogin(email, name, phone, username, password);
                        }} 
                        lang={lang}
                    />
                );
            }

            // Render Merchant Detail Page if selected
            if (selectedMerchant) {
                return (
                    <MerchantDetailScreen 
                        merchant={selectedMerchant}
                        onBack={() => setSelectedMerchant(null)}
                        isFavorite={favorites.includes(selectedMerchant.id)}
                        toggleFavorite={toggleFavorite}
                        onAddToCart={handleAddToCart}
                        onRemoveFromCart={(itemId) => setCart(prev => {
                            const existing = prev.find(i => i.id === itemId);
                            if (!existing) return prev;
                            if (existing.qty <= 1) return prev.filter(i => i.id !== itemId);
                            return prev.map(i => i.id === itemId ? {...i, qty: i.qty - 1} : i);
                        })}
                        cart={cart}
                        lang={lang}
                        t={t}
                        onShowCart={() => setShowCartModal(true)}
                        showCartModal={showCartModal}
                        setShowCartModal={setShowCartModal}
                        setCart={setCart}
                        handleCheckout={handleCheckout}
                    />
                );
            }

            return (
                <>
                    {/* TOP HEADER (Responsive) */}
                    {currentTab === 'profile' ? (
                        <div className="app-header" style={{display: 'flex', justifyContent: 'center', alignItems: 'center', position: 'relative'}}>
                            <div style={{fontSize: '18px', fontWeight: '500'}}>Hesabım</div>
                            <div style={{position: 'absolute', right: '20px', cursor: 'pointer'}} onClick={() => alert("Henüz yeni bildiriminiz yok.")}>
                                <i className="fa-regular fa-bell" style={{fontSize: '22px'}}></i>
                            </div>
                        </div>
                    ) : (
                        <div className="app-header">
                            <div className="header-container" style={{ position: 'relative', display: 'flex', justifyContent: 'center', alignItems: 'center' }}>
                                <div style={{ position: 'absolute', left: 0, top: '50%', transform: 'translateY(-50%)' }}>
                                    <i 
                                        className="fa-solid fa-map-location-dot" 
                                        style={{fontSize: '22px', cursor: 'pointer', color: currentTab === 'map' ? 'white' : 'rgba(255,255,255,0.7)'}} 
                                        onClick={() => setCurrentTab('map')} 
                                        title="Haritada Ara"
                                    ></i>
                                </div>
                                
                                <div style={{display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer'}} onClick={() => setCurrentTab('home')}>
                                    <i className="fa-solid fa-stamp" style={{fontSize: '24px'}}></i>
                                    <h1 style={{fontSize: '22px', fontWeight: '800', margin: 0, letterSpacing: '1px'}}>MÜDAVİM</h1>
                                </div>
                                
                                {/* Desktop Navigation Links */}
                                <div className="desktop-nav" style={{marginLeft: '40px', marginRight: '40px'}}>
                                    <span className={`desktop-nav-item ${currentTab === 'home' ? 'active' : ''}`} onClick={() => { setQrDataOverride(null); setCurrentTab('home'); }}>Ana Menü</span>
                                    <span className={`desktop-nav-item ${currentTab === 'search' ? 'active' : ''}`} onClick={() => { setQrDataOverride(null); setCurrentTab('search'); }}>Arama & Keşfet</span>
                                    <span className={`desktop-nav-item ${currentTab === 'qr' ? 'active' : ''}`} onClick={() => setCurrentTab('qr')}>QR İşlemleri</span>
                                    <span className={`desktop-nav-item ${currentTab === 'coupons' ? 'active' : ''}`} onClick={() => setCurrentTab('coupons')}>Ödüllerim</span>
                                    <span className={`desktop-nav-item ${currentTab === 'profile' ? 'active' : ''}`} onClick={() => setCurrentTab('profile')}>Hesabım</span>
                                </div>

                                <div style={{ position: 'absolute', right: 0, top: '50%', transform: 'translateY(-50%)', display: 'flex', alignItems: 'center', gap: '16px' }}>
                                    {/* Cart Icon with badge */}
                                    <div style={{position: 'relative', cursor: 'pointer'}} onClick={() => setShowCartModal(true)}>
                                        <i className="fa-solid fa-bag-shopping" style={{fontSize: '22px', color: 'white'}}></i>
                                        {cart.length > 0 && (
                                            <span style={{position: 'absolute', top: '-8px', right: '-8px', background: '#EF4444', color: 'white', borderRadius: '50%', width: '18px', height: '18px', fontSize: '11px', fontWeight: '800', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid var(--brand-primary)'}}>
                                                {cart.reduce((s, i) => s + i.qty, 0)}
                                            </span>
                                        )}
                                    </div>
                                    <i className="fa-regular fa-bell" style={{fontSize: '22px', cursor: 'pointer'}} onClick={() => alert(t('noNotifications'))}></i>
                                </div>
                            </div>
                        </div>
                    )}

                    {currentTab === 'home' && <HomeScreen favorites={favorites} toggleFavorite={toggleFavorite} onMerchantClick={handleMerchantClick} lang={lang} t={t} activeOrders={activeOrders} />}
                    {currentTab === 'search' && <SearchScreen favorites={favorites} toggleFavorite={toggleFavorite} onMerchantClick={handleMerchantClick} lang={lang} t={t} />}
                    {currentTab === 'map' && <MapScreen merchants={merchants} onMerchantClick={handleMerchantClick} />}
                    {currentTab === 'qr' && <QRScreen addOrder={addOrder} currentUser={currentUser} cart={cart} lang={lang} t={t} qrDataOverride={qrDataOverride} />}
                    {currentTab === 'profile' && (
                        <ProfileScreen 
                            onLogout={() => {
                                setIsLoggedIn(false); 
                                setCurrentUser(null); 
                                localStorage.removeItem('mudavim_user'); 
                                setCurrentTab('home');
                            }} 
                            favorites={favorites}
                            toggleFavorite={toggleFavorite}
                            orders={orders}
                            addReview={addReview}
                            reviews={reviews}
                            onMerchantClick={handleMerchantClick}
                            currentUser={currentUser}
                            onUpdateProfile={handleUpdateProfile}
                            lang={lang}
                            onLanguageChange={(newLang) => setLang(newLang)}
                            t={t}
                            onRepeatOrder={(order) => {
                                // Build cart items from the order
                                const merchant = merchants.find(m => m.id === order.merchantId);
                                const menuItems = merchant ? getMerchantMenu(merchant, lang) : [];
                                // Try to find the menu item by name match, else create a minimal item
                                let itemToAdd = menuItems.find(i => i.name === order.desc || order.desc?.includes(i.name));
                                if (!itemToAdd) {
                                    itemToAdd = {
                                        id: `repeat_${order.id}`,
                                        name: order.desc || (lang === 'tr' ? 'Sipariş Kalemi' : 'Order Item'),
                                        price: order.price || 0,
                                        img: merchant?.img || '',
                                        desc: '',
                                        merchantId: order.merchantId
                                    };
                                }
                                setCart([{ ...itemToAdd, qty: 1, merchantId: order.merchantId }]);
                                setCurrentTab('home');
                                setShowCartModal(true);
                            }}
                        />
                    )}
                    {currentTab === 'coupons' && <CouponsScreen coupons={coupons} onUseCoupon={handleUseCoupon} lang={lang} t={t} />}

                    {/* BOTTOM NAV (Mobile Only) */}
                    <div className="bottom-nav">
                        <div className={`nav-item ${currentTab === 'home' ? 'active' : ''}`} onClick={() => setCurrentTab('home')}>
                            <i className="fa-solid fa-house"></i>
                            <span>{lang === 'tr' ? 'Anasayfa' : 'Home'}</span>
                        </div>
                        <div className={`nav-item ${currentTab === 'search' ? 'active' : ''}`} onClick={() => setCurrentTab('search')}>
                            <i className="fa-solid fa-magnifying-glass"></i>
                            <span>{lang === 'tr' ? 'Arama' : 'Search'}</span>
                        </div>
                        <div className={`nav-item floating-container ${currentTab === 'qr' ? 'active' : ''}`} onClick={() => setCurrentTab('qr')}>
                            <div className="floating-btn-circle">
                                <i className="fa-solid fa-qrcode"></i>
                            </div>
                            <span style={{marginTop: '35px'}}>{lang === 'tr' ? 'Okut' : 'Scan'}</span>
                        </div>
                        <div className={`nav-item ${currentTab === 'coupons' ? 'active' : ''}`} onClick={() => setCurrentTab('coupons')}>
                            <i className="fa-solid fa-gift"></i>
                            <span>{lang === 'tr' ? 'Kampanyalar' : 'Rewards'}</span>
                        </div>
                        <div className={`nav-item ${currentTab === 'profile' ? 'active' : ''}`} onClick={() => setCurrentTab('profile')}>
                            <i className={`${currentTab === 'profile' ? 'fa-solid' : 'fa-regular'} fa-user`}></i>
                            <span>{lang === 'tr' ? 'Hesabım' : 'Profile'}</span>
                        </div>
                    </div>
                    {/* CART MODAL */}
                    {showCartModal && (
                        <>
                            <div style={{position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', background: 'rgba(0,0,0,0.5)', zIndex: 2000}} onClick={() => setShowCartModal(false)}></div>
                            <div style={{position: 'fixed', bottom: 0, left: 0, width: '100%', maxHeight: '80vh', background: 'white', borderTopLeftRadius: '24px', borderTopRightRadius: '24px', zIndex: 2001, display: 'flex', flexDirection: 'column', animation: 'slideUp 0.3s ease'}}>
                                <div style={{padding: '20px', borderBottom: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                    <h3 style={{margin: 0, fontSize: '20px', fontWeight: '800'}}>
                                        <i className="fa-solid fa-bag-shopping" style={{color: 'var(--brand-primary)', marginRight: '10px'}}></i>
                                        {t('cart')}
                                    </h3>
                                    <i className="fa-solid fa-times" style={{fontSize: '22px', cursor: 'pointer', color: 'var(--text-muted)'}} onClick={() => setShowCartModal(false)}></i>
                                </div>
                                <div style={{flex: 1, overflowY: 'auto', padding: '15px'}}>
                                    {cart.length === 0 ? (
                                        <div style={{textAlign: 'center', color: 'var(--text-muted)', padding: '40px 0'}}>
                                            <i className="fa-solid fa-bag-shopping" style={{fontSize: '50px', color: '#DDD', marginBottom: '15px'}}></i>
                                            <p>{t('cartEmpty')}</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} style={{display: 'flex', alignItems: 'center', gap: '15px', padding: '12px 0', borderBottom: '1px solid var(--border-color)'}}>
                                                <img src={item.img} alt={item.name} style={{width: '60px', height: '60px', borderRadius: '10px', objectFit: 'cover'}} />
                                                <div style={{flex: 1}}>
                                                    <div style={{fontWeight: '700', fontSize: '15px'}}>{item.name}</div>
                                                    <div style={{color: 'var(--brand-primary)', fontWeight: '800', fontSize: '14px'}}>{item.price} TL</div>
                                                </div>
                                                <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                                    <button onClick={() => setCart(prev => prev.map(i => i.id === item.id ? {...i, qty: Math.max(1, i.qty - 1)} : i))} style={{width: '30px', height: '30px', borderRadius: '50%', border: '1px solid var(--border-color)', background: 'white', cursor: 'pointer', fontSize: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>-</button>
                                                    <span style={{fontWeight: '700', minWidth: '20px', textAlign: 'center'}}>{item.qty}</span>
                                                    <button onClick={() => setCart(prev => prev.map(i => i.id === item.id ? {...i, qty: i.qty + 1} : i))} style={{width: '30px', height: '30px', borderRadius: '50%', background: 'var(--brand-primary)', border: 'none', color: 'white', cursor: 'pointer', fontSize: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>+</button>
                                                    <button onClick={() => setCart(prev => prev.filter(i => i.id !== item.id))} style={{width: '30px', height: '30px', borderRadius: '50%', background: '#FEE2E2', border: 'none', color: '#EF4444', cursor: 'pointer', fontSize: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                                                        <i className="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div style={{padding: '15px', borderTop: '1px solid var(--border-color)'}}>
                                        <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '15px', fontSize: '18px', fontWeight: '800'}}>
                                            <span>{t('cartTotal')}</span>
                                            <span style={{color: 'var(--brand-primary)'}}>{cart.reduce((s, i) => s + i.price * i.qty, 0)} TL</span>
                                        </div>
                                        <div style={{display: 'flex', gap: '10px'}}>
                                            <button onClick={() => setCart([])} style={{flex: 1, background: 'white', color: '#64748B', border: '1px solid #64748B', padding: '14px', borderRadius: '24px', fontSize: '14px', fontWeight: '700', cursor: 'pointer'}}>{t('clearCart')}</button>
                                            <button onClick={handleCheckout} style={{flex: 2, background: 'var(--brand-primary)', color: 'white', border: 'none', padding: '14px', borderRadius: '24px', fontSize: '14px', fontWeight: '700', cursor: 'pointer'}}>
                                                <i className="fa-solid fa-check" style={{marginRight: '8px'}}></i>
                                                {t('checkout')}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </>
                    )}


                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
